apiVersion: 1

apps:
  # Enable the chat plugin (unsigned, allowed via env in docker-compose).
  - type: 'staffops-aigent-squad-chat-app'
    org_id: 1
    disabled: false

  # Point the Grafana LLM app at the local mock AIgent Squad (custom OpenAI-compatible URL).
  # This is the same shape proven in the Task 1.5 spike. In production this provider is
  # configured to the real AIgent Squad endpoint (never stored in the repo).
  - type: 'grafana-llm-app'
    org_id: 1
    disabled: false
    jsonData:
      openAI:
        provider: openai
        url: http://mock-aigent:8000
    secureJsonData:
      openAIKey: dev-token
