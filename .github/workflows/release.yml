name: Release

on:
  push:
    tags:
      - 'v*' # e.g. v0.2.0

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/staffops-servicemap-panel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/staffops-servicemap-panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Unsigned build: no MANIFEST.txt. The plugin id must be added to
      # GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS in the target Grafana.
      - name: Package plugin (unsigned)
        run: |
          PLUGIN_ID=$(jq -r .id dist/plugin.json)
          VERSION=$(jq -r .info.version dist/plugin.json)
          ARCHIVE="${PLUGIN_ID}-${VERSION}.zip"
          cp -r dist "${PLUGIN_ID}"
          zip -r "${ARCHIVE}" "${PLUGIN_ID}"
          echo "ARCHIVE_PATH=packages/staffops-servicemap-panel/${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
          generate_release_notes: true
          body: |
            Unsigned Grafana panel plugin build.

            Install by pointing `grafana.plugins` at the attached zip URL and
            adding `staffops-servicemap-panel` to
            `GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS`.
