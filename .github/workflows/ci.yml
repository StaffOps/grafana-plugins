name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # pnpm workspace: install at the repo root, run scripts in the package.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/staffops-servicemap-panel
        run: npm run typecheck

      - name: Lint
        working-directory: packages/staffops-servicemap-panel
        run: npm run lint

      - name: Unit tests
        working-directory: packages/staffops-servicemap-panel
        run: npm run test:ci

      - name: Build frontend
        working-directory: packages/staffops-servicemap-panel
        run: npm run build
