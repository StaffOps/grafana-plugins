# Task 1.5 spike — throwaway local stack (NOT part of the plugin).
# Validates: grafana-llm-app with a custom OpenAI base URL forwards to a custom endpoint
# with Bearer auth and proxies streaming SSE (incl. a simulated tool-call pause).
#
#   docker compose up -d
#   # configure the LLM app provider (see README-spike.md), then test streaming
#   docker compose logs -f mock-aigent   # proves what the LLM app forwarded
#   docker compose down
services:
  mock-aigent:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./mock-aigent:/app:ro
    command: python server.py
    ports:
      - "8760:8000"

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.0.2}
    depends_on:
      - mock-aigent
    environment:
      - GF_INSTALL_PLUGINS=grafana-llm-app
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=
    ports:
      - "3000:3000"
